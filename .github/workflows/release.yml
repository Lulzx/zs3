name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-musl
            asset: zs3-x86_64-linux-musl
          - runner: ubuntu-latest
            target: aarch64-linux-musl
            asset: zs3-aarch64-linux-musl
          - runner: macos-14
            target: aarch64-macos
            asset: zs3-aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=ReleaseSmall
      - run: cp zig-out/bin/zs3 ${{ matrix.asset }} && ls -l ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR repository paths must be lowercase; the owner name may not be.
      - run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.ref_name }}
