name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=ReleaseSmall
      - run: ls -l zig-out/bin/zs3 && file zig-out/bin/zs3

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3
      - run: zig build -Doptimize=ReleaseSmall
      - run: |
          rm -rf /tmp/zs3-ci && mkdir -p /tmp/zs3-ci
          ./zig-out/bin/zs3 --data-dir=/tmp/zs3-ci --port=9000 &
          echo $! > /tmp/zs3.pid
          sleep 1
      - run: python3 test_client.py
      - run: python3 test_comprehensive.py
      - run: python3 test_new.py
      - run: python3 test_bootstrap.py
      - run: kill $(cat /tmp/zs3.pid) || true

  replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSmall
      - run: python3 test_replication.py
